<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Persona Agent Simulation — 롯데면세점</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#eef1f5; --panel:#ffffff; --panel2:#f4f6f9; --border:#dde3ea;
    --txt:#2b333d; --dim:#7a8694; --accent:#3b82f6; --gold:#b8863a;
    --green:#16a34a;
    --mono:'SF Mono','Consolas','Roboto Mono',monospace;
    --sans:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  }
  body{background:#dfe4ea; color:var(--txt); font-family:var(--sans);
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:16px;}
  .app{width:100%; max-width:1080px; background:var(--panel); border:1px solid var(--border);
    border-radius:12px; overflow:hidden; box-shadow:0 16px 44px rgba(60,80,110,.18);}

  .header{background:var(--panel2); border-bottom:1px solid var(--border); padding:12px 18px;
    display:flex; align-items:center; gap:14px;}
  .header .status-led{width:9px;height:9px;border-radius:50%;background:var(--green);
    box-shadow:0 0 8px rgba(22,163,74,.5); animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  .header .title{font-weight:700; font-size:15px;}
  .header .title small{color:var(--dim); font-weight:500; font-size:12px; margin-left:8px;}
  .header .meta{margin-left:auto; display:flex; gap:18px; font-family:var(--mono); font-size:11px; color:var(--dim);}
  .header .meta b{color:var(--txt);}

  .body{display:grid; grid-template-columns:230px 1fr; min-height:520px;}
  .sidebar{background:var(--panel2); border-right:1px solid var(--border); padding:14px;
    display:flex; flex-direction:column; gap:12px;}
  .sec-label{font-family:var(--mono); font-size:10px; letter-spacing:1px; color:var(--dim); text-transform:uppercase;}
  .agent-card{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px;
    transition:all .3s; position:relative; overflow:hidden; margin-bottom:10px;}
  .agent-card::before{content:""; position:absolute; left:0;top:0;bottom:0; width:3px; background:transparent;}
  .agent-card.ojunseo::before{background:#2e9d8a;}
  .agent-card.parkhyunju::before{background:#4a7ac8;}
  .agent-card.eeunae::before{background:#b08050;}
  .agent-card.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent),0 4px 12px rgba(59,130,246,.15);}
  .agent-head{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .agent-head .nm{font-weight:700; font-size:14px;}
  .agent-head .role{font-size:10px; padding:1px 6px; border-radius:4px; background:var(--border); color:var(--dim);}
  .agent-card.active .agent-head .role{background:var(--accent); color:#fff;}
  .agent-info{font-family:var(--mono); font-size:10.5px; color:var(--dim); line-height:1.7;}
  .agent-info .k{color:#a4adb8;}
  .agent-state{margin-top:8px; padding-top:8px; border-top:1px solid var(--border);
    display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10.5px;}
  .agent-state .led{width:7px;height:7px;border-radius:50%; background:#c4ccd5; flex-shrink:0; transition:.3s;}
  .agent-card.active .agent-state .led{background:var(--green); box-shadow:0 0 6px rgba(22,163,74,.6);}
  .agent-state .st{color:var(--dim);}
  .agent-card.active .agent-state .st{color:var(--green);}
  .agent-state .led.waiting{background:var(--gold); box-shadow:0 0 6px rgba(184,134,58,.6);}

  .scene-wrap{display:flex; flex-direction:column;}
  /* 밝은 면세점: 밝은 벽 + 밝은 바닥 */
  .scene{position:relative; height:380px; overflow:hidden;
    background:linear-gradient(180deg,#eaf3f9 0%,#dfeef6 50%,#ece2d2 50%,#e6dcc8 100%);
    border-bottom:1px solid var(--border);}
  .grid-floor{position:absolute; left:0;right:0;bottom:0; height:50%;
    background-image:repeating-linear-gradient(90deg,transparent 0 76px,rgba(150,130,95,.18) 76px 78px); opacity:.7;}
  /* 밝은 조명 효과 */
  .ceiling-light{position:absolute; top:0; height:8px; border-radius:0 0 20px 20px;
    background:linear-gradient(90deg,transparent,#fff8e8,transparent); opacity:.9;}
  .ceiling-light.l1{left:15%; width:120px;} .ceiling-light.l2{left:45%; width:120px;} .ceiling-light.l3{left:72%; width:120px;}
  .signboard{position:absolute; top:16px; left:50%; transform:translateX(-50%);
    background:#fff; border:2px solid var(--gold); border-radius:6px;
    padding:5px 20px; font-weight:800; color:var(--gold); letter-spacing:2px; font-size:13px; font-family:var(--mono);
    box-shadow:0 3px 8px rgba(0,0,0,.08);}
  .signboard small{display:block; text-align:center; font-size:8px; color:#c4a468; letter-spacing:1px;}
  .counter{position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    width:280px; height:58px; background:linear-gradient(180deg,#b08d5f,#997a4f);
    border-radius:8px 8px 3px 3px; box-shadow:0 8px 18px rgba(120,90,50,.3); z-index:2;}
  .counter::before{content:""; position:absolute; top:-7px; left:-8px; right:-8px; height:12px; background:#c19a68; border-radius:6px;}
  .counter .lbl{position:absolute; top:14px; left:0;right:0; text-align:center; color:#fff3e0; font-family:var(--mono); font-size:10px; letter-spacing:2px;}
  /* 진열장 장식 */
  .shelf{position:absolute; top:64px; width:76px; height:96px; background:rgba(255,255,255,.7);
    border:1.5px solid #d5c4a5; border-radius:5px; box-shadow:inset 0 0 0 4px rgba(255,255,255,.5);}
  .shelf.left{left:24px;} .shelf.right{right:24px;}
  .shelf .it{position:absolute; width:12px; height:16px; border-radius:2px;}

  /* 캐릭터 */
  .actor{position:absolute; width:110px; height:172px;
    background-size:contain; background-position:bottom center; background-repeat:no-repeat;
    filter:drop-shadow(0 6px 8px rgba(80,70,50,.22));
    transition:left .9s cubic-bezier(.4,0,.2,1), bottom .9s cubic-bezier(.4,0,.2,1), opacity .6s, filter .3s, transform .4s; opacity:.9;}
  /* 직원: 카운터 뒤(위쪽), 손님: 카운터 앞(아래쪽) → 세로로 분리해서 안겹침 */
  .actor.parkhyunju{left:calc(50% + 20px); bottom:62px; z-index:1; transform:scale(.82);}
  .actor.ojunseo{z-index:3; bottom:40px;}
  .actor.eeunae{z-index:3; bottom:40px;}

  .actor.active{filter:drop-shadow(0 10px 12px rgba(59,130,246,.3)) brightness(1.04); opacity:1;}
  .actor.speaking-anim{animation:float .7s ease infinite alternate;}
  @keyframes float{from{transform:translateY(0);}to{transform:translateY(-7px);}}
  .actor.parkhyunju.speaking-anim{animation:floatC .7s ease infinite alternate;}
  @keyframes floatC{from{transform:scale(.84) translateY(0);}to{transform:scale(.84) translateY(-6px);}}

  .speech{position:absolute; bottom:238px; max-width:236px; transform:translateX(-50%) scale(0);
    background:#fff; color:#1a1f26; padding:11px 15px; border-radius:12px; font-size:13px; line-height:1.5;
    box-shadow:0 6px 18px rgba(80,70,50,.25); transform-origin:bottom center; border:1px solid #eee;
    transition:transform .3s cubic-bezier(.2,1.3,.4,1), left .9s cubic-bezier(.4,0,.2,1); z-index:6;}
  .speech.show{transform:translateX(-50%) scale(1);}
  .speech::after{content:""; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%);
    border:8px solid transparent; border-top-color:#fff; border-bottom:0;}

  .action-tag{position:absolute; bottom:14px; transform:translateX(-50%) translateY(6px); opacity:0;
    background:rgba(59,130,246,.12); border:1px solid var(--accent); color:#2563eb; font-family:var(--mono);
    font-size:10px; padding:3px 8px; border-radius:4px; white-space:nowrap;
    transition:opacity .3s, transform .3s, left .9s cubic-bezier(.4,0,.2,1); z-index:4;}
  .action-tag.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .console{background:#1a1f27; border-top:1px solid var(--border);}
  .log-head{display:flex; align-items:center; gap:8px; padding:8px 14px; border-bottom:1px solid #2b333d;
    font-family:var(--mono); font-size:10px; color:#8a95a3; letter-spacing:1px;}
  .log-head .dot{width:8px;height:8px;border-radius:50%;}
  .log-head .r{background:#e06c5e;}.log-head .y{background:#e0b85e;}.log-head .g{background:#5ee081;}
  .log{height:108px; overflow-y:auto; padding:10px 14px; font-family:var(--mono); font-size:11.5px; line-height:1.9; color:#c8d0da;}
  .log::-webkit-scrollbar{width:8px;} .log::-webkit-scrollbar-thumb{background:#2b333d; border-radius:4px;}
  .log-line{opacity:0; animation:fadein .3s forwards;}
  @keyframes fadein{to{opacity:1;}}
  .log-line .t{color:#5a6472;} .log-line .turn{color:#d4a94a;}
  .log-line .sp-ojunseo{color:#4fd6bf;} .log-line .sp-parkhyunju{color:#7aa8ff;} .log-line .sp-eeunae{color:#d4a878;}
  .log-line .act{color:#8a95a3;} .log-line .sys{color:#5ee081;}

  .controls{display:flex; align-items:center; gap:12px; padding:10px 14px; border-top:1px solid var(--border); background:var(--panel2);}
  .progress-bar{flex:1; height:5px; background:var(--border); border-radius:3px; overflow:hidden;}
  .progress-fill{height:100%; width:0; background:linear-gradient(90deg,var(--accent),#7ab0ff); transition:width .4s;}
  .turn-count{font-family:var(--mono); font-size:11px; color:var(--dim);} .turn-count b{color:var(--txt);}
  button{font-family:var(--mono); font-size:12px; font-weight:600; padding:7px 16px; border-radius:6px;
    border:1px solid var(--border); background:var(--panel); color:var(--txt); cursor:pointer; transition:.2s;}
  button:hover{border-color:var(--accent); color:var(--accent);}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  button.primary:hover{opacity:.88; color:#fff;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="status-led"></div>
    <div class="title">PERSONA AGENT SIMULATION <small>롯데면세점 · 상품 수령 데스크 (줄서기 응대)</small></div>
    <div class="meta">
      <span>MODEL <b>Llama-3.3-70B</b></span>
      <span>QUEUE <b id="queueCount">2</b></span>
      <span>ELAPSED <b id="elapsed">00:00</b></span>
    </div>
  </div>

  <div class="body">
    <div class="sidebar">
      <div class="sec-label">// AGENTS</div>
      <div id="agentCards"></div>
      <div class="sec-label">// SCENARIO</div>
      <div style="font-family:var(--mono); font-size:10.5px; color:var(--dim); line-height:1.7; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px;">
        손님이 순서대로 카운터에 와서 상품을 수령한다. 오준서 응대가 끝나면 대기 중이던 이은애가 카운터로 이동한다.
      </div>
    </div>

    <div class="scene-wrap">
      <div class="scene" id="scene">
        <div class="grid-floor"></div>
        <div class="ceiling-light l1"></div><div class="ceiling-light l2"></div><div class="ceiling-light l3"></div>
        <div class="signboard">DUTY FREE<small>PICK-UP COUNTER</small></div>
        <div class="shelf left"><span class="it" style="top:10px;left:10px;background:#c47b7b;"></span><span class="it" style="top:10px;left:44px;background:#7ba3c4;"></span><span class="it" style="top:40px;left:10px;background:#c4a87b;"></span><span class="it" style="top:40px;left:44px;background:#9b7bc4;"></span><span class="it" style="top:70px;left:28px;background:#7bc49b;"></span></div>
        <div class="shelf right"><span class="it" style="top:10px;left:10px;background:#7bc49b;"></span><span class="it" style="top:10px;left:44px;background:#c47b7b;"></span><span class="it" style="top:40px;left:28px;background:#c4a87b;"></span><span class="it" style="top:70px;left:10px;background:#7ba3c4;"></span><span class="it" style="top:70px;left:44px;background:#9b7bc4;"></span></div>
        <div class="counter"><div class="lbl">PICK-UP</div></div>
        <div class="actor parkhyunju" id="a-parkhyunju"></div>
        <div class="actor ojunseo" id="a-ojunseo"></div>
        <div class="actor eeunae" id="a-eeunae"></div>
        <div class="speech" id="speech"></div>
        <div class="action-tag" id="actionTag"></div>
      </div>

      <div class="console">
        <div class="log-head"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>&nbsp;&nbsp;CONVERSATION LOG</div>
        <div class="log" id="log"></div>
        <div class="controls">
          <span class="turn-count">TURN <b id="turnNum">0</b> / <span id="turnTotal">0</span></span>
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <button id="restartBtn">RESTART</button>
          <button class="primary" id="playBtn">▶ RUN</button>
        </div>
      </div>
    </div>
  </div>
</div>

  const P=DATA.personas, DIALOGUE=DATA.dialogue, IMG=DATA.img;
  const KEYS=["ojunseo","parkhyunju","eeunae"];

  // 손님 위치 (카운터 앞 정중앙 = 대화 위치 / 대기줄 / 퇴장)
  const POS = { counter:"calc(50% - 130px)", queue1:"66%", queue2:"82%", exitL:"2%" };

  KEYS.forEach(k=>{ document.getElementById("a-"+k).style.backgroundImage=`url(${IMG[k]})`; });

  const aOj=document.getElementById("a-ojunseo"), aEu=document.getElementById("a-eeunae");
  function setInit(){
    aOj.style.left=POS.queue1; aOj.style.bottom="40px"; aOj.style.opacity=".9";
    aEu.style.left=POS.queue2; aEu.style.bottom="40px"; aEu.style.opacity=".9";
  }
  setInit();

  const agentCards=document.getElementById("agentCards");
  KEYS.forEach(k=>{
    const p=P[k];
    const d=document.createElement("div");
    d.className="agent-card "+k; d.id="card-"+k;
    d.innerHTML=`<div class="agent-head"><span class="nm">${p.name}</span><span class="role">${p.tag}</span></div>
      <div class="agent-info"><div><span class="k">age</span> ${p.age} · <span class="k">job</span> ${p.job}</div>
      <div><span class="k">loc</span> ${p.loc}</div></div>
      <div class="agent-state"><span class="led" id="led-${k}"></span><span class="st" id="st-${k}">IDLE</span></div>`;
    agentCards.appendChild(d);
  });

  const speech=document.getElementById("speech"), actionTag=document.getElementById("actionTag");
  const logEl=document.getElementById("log"), playBtn=document.getElementById("playBtn"), restartBtn=document.getElementById("restartBtn");
  const turnNum=document.getElementById("turnNum"), turnTotal=document.getElementById("turnTotal");
  const progressFill=document.getElementById("progressFill"), elapsedEl=document.getElementById("elapsed");
  const queueCount=document.getElementById("queueCount");
  turnTotal.textContent=DIALOGUE.length;

  let idx=-1, playing=false, timer=null, typeT=null, startTime=null, clockT=null;
  let ojunseoArrived=false, eeunaeArrived=false, ojunseoLeft=false;

  function setState(k,label,cls){ document.getElementById("st-"+k).textContent=label;
    document.getElementById("led-"+k).className="led"+(cls?" "+cls:""); }
  function clearActive(){
    KEYS.forEach(k=>{ document.getElementById("a-"+k).classList.remove("active","speaking-anim");
      document.getElementById("card-"+k).classList.remove("active"); });
    speech.className="speech"; actionTag.className="action-tag";
  }
  function pad(n){return String(n).padStart(2,"0");}
  function startClock(){startTime=Date.now(); clearInterval(clockT);
    clockT=setInterval(()=>{const s=Math.floor((Date.now()-startTime)/1000);
      elapsedEl.textContent=pad(Math.floor(s/60))+":"+pad(s%60);},500);}
  function addLog(html){const d=document.createElement("div"); d.className="log-line"; d.innerHTML=html;
    logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight;}
  function logTurn(line){const p=P[line.speaker];
    addLog(`<span class="t">[${new Date().toLocaleTimeString('en-GB')}]</span> `+
      `<span class="turn">T${idx+1}</span> <span class="sp-${line.speaker}">${p.name}</span> `+
      `<span class="act">→ ${line.action}</span>`);}
  function logSys(msg){ addLog(`<span class="t">[SYSTEM]</span> <span class="sys">${msg}</span>`); }
  function typeSpeech(text){speech.textContent=""; let i=0; clearInterval(typeT);
    typeT=setInterval(()=>{i++; speech.textContent=text.slice(0,i); if(i>=text.length)clearInterval(typeT);},35);}

  function speakerLeft(line){ return line.speaker==="parkhyunju" ? "50%" : "calc(50% + 0px)"; }

  function showTurn(i){
    const line=DIALOGUE[i], p=P[line.speaker];

    if(line.phase==="ojunseo" && !ojunseoArrived){
      ojunseoArrived=true; aOj.style.left=POS.counter; setState("ojunseo","AT COUNTER");
      logSys("오준서 → 카운터 이동");
    }
    if(line.phase==="eeunae" && !eeunaeArrived){
      eeunaeArrived=true;
      if(!ojunseoLeft){ aOj.style.left=POS.exitL; aOj.style.opacity="0"; ojunseoLeft=true; setState("ojunseo","DONE"); }
      aEu.style.left=POS.counter; setState("eeunae","AT COUNTER");
      queueCount.textContent="1"; logSys("오준서 수령 완료 · 이은애 → 카운터 이동");
    }

    clearActive();
    const actor=document.getElementById("a-"+line.speaker);
    actor.classList.add("active","speaking-anim");
    document.getElementById("card-"+line.speaker).classList.add("active");

    // 상태 라벨 갱신
    setState(line.speaker,"SPEAKING");
    if(!eeunaeArrived) setState("eeunae","WAITING","waiting");
    if(ojunseoLeft) setState("ojunseo","DONE");

    const lx=speakerLeft(line);
    speech.style.left = line.speaker==="parkhyunju" ? "calc(50% + 75px)" : "calc(50% - 75px)";
    speech.className="speech"; setTimeout(()=>speech.classList.add("show"),60); typeSpeech(line.text);
    actionTag.style.left = speech.style.left; actionTag.className="action-tag";
    actionTag.textContent="ACTION: "+line.action; setTimeout(()=>actionTag.classList.add("show"),400);

    logTurn(line); turnNum.textContent=i+1; progressFill.style.width=((i+1)/DIALOGUE.length*100)+"%";

    if(playing){
      const delay=(line.phase==="ojunseo_end")?3400:2600;
      timer=setTimeout(()=>{ if(idx<DIALOGUE.length-1){idx++; showTurn(idx);} else endRun(); }, delay);
    }
  }

  function endRun(){ playing=false; playBtn.textContent="▶ RE-RUN"; clearInterval(clockT); clearActive();
    KEYS.forEach(k=>{ if(document.getElementById("st-"+k).textContent!=="DONE") setState(k,"DONE"); });
    logSys("✓ 시뮬레이션 종료 — 모든 손님 수령 완료"); queueCount.textContent="0"; }
  function run(){
    if(playing){playing=false; playBtn.textContent="▶ RESUME"; clearTimeout(timer); clearInterval(typeT); clearInterval(clockT); return;}
    if(idx>=DIALOGUE.length-1||idx<0){ resetScene(); idx=0; startClock(); }
    playing=true; playBtn.textContent="⏸ PAUSE"; showTurn(idx);
  }
  function resetScene(){ clearTimeout(timer); clearInterval(typeT);
    idx=-1; ojunseoArrived=false; eeunaeArrived=false; ojunseoLeft=false;
    clearActive(); logEl.innerHTML=""; setInit();
    KEYS.forEach(k=>setState(k,"IDLE"));
    setState("eeunae","WAITING","waiting");
    turnNum.textContent="0"; progressFill.style.width="0"; elapsedEl.textContent="00:00"; queueCount.textContent="2"; }
  function restart(){ playing=false; clearInterval(clockT); resetScene(); playBtn.textContent="▶ RUN"; }

  setState("eeunae","WAITING","waiting");
  playBtn.onclick=run; restartBtn.onclick=restart;
</script>
