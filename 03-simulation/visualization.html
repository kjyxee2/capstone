<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>롯데면세점 페르소나 대화 시뮬레이션</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --floor: #d9c7b0;
    --floor-line: #c9b195;
    --wall-top: #eaf2f6;
    --wall-bot: #cfe0ea;
    --counter: #6b4f3a;
    --counter-top: #8a6a4d;
    --gold: #c8a04a;
    --ink: #2b2b2b;
    --panel: #ffffff;
  }
  body {
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #1a1f26;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:20px;
    color: var(--ink);
  }
  .stage {
    width: 100%; max-width: 820px;
    background: var(--panel);
    border-radius: 18px;
    overflow:hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }
  /* 타이틀 바 */
  .titlebar {
    background: linear-gradient(90deg, #a8863f, #c8a04a, #a8863f);
    color:#fff; padding: 12px 20px;
    display:flex; align-items:center; justify-content:space-between;
    font-weight:700; letter-spacing:.5px;
  }
  .titlebar .brand { font-size: 17px; }
  .titlebar .brand span { opacity:.85; font-weight:500; font-size:13px; margin-left:8px;}
  .titlebar .tag { font-size:12px; background:rgba(255,255,255,.2); padding:4px 10px; border-radius:20px;}

  /* 면세점 배경 씬 */
  .scene {
    position:relative;
    height: 380px;
    background:
      linear-gradient(180deg, var(--wall-top) 0%, var(--wall-bot) 55%, var(--floor) 55%, var(--floor) 100%);
    overflow:hidden;
  }
  /* 바닥 원근 라인 */
  .floor-lines {
    position:absolute; left:0; right:0; bottom:0; height:45%;
    background-image:
      repeating-linear-gradient(90deg, transparent 0 78px, var(--floor-line) 78px 80px);
    opacity:.5;
  }
  /* 벽면 면세 간판 */
  .signboard {
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    background:#fff; border:3px solid var(--gold); border-radius:10px;
    padding:6px 22px; font-weight:800; color:#8a6a4d; letter-spacing:2px;
    font-size:15px; box-shadow:0 4px 10px rgba(0,0,0,.08);
  }
  .signboard small { display:block; text-align:center; font-size:10px; letter-spacing:1px; color:#b9a06f; font-weight:600;}
  /* 진열장 (배경 장식) */
  .shelf {
    position:absolute; top:70px; width:90px; height:120px;
    background:linear-gradient(180deg,#f4ede0,#e6d8c2);
    border:2px solid #d8c4a5; border-radius:6px;
    box-shadow: inset 0 0 0 6px rgba(255,255,255,.4);
  }
  .shelf::before, .shelf::after {
    content:""; position:absolute; left:8px; right:8px; height:2px; background:#d8c4a5;
  }
  .shelf::before { top:38px; } .shelf::after { top:76px; }
  .shelf.left { left:34px; } .shelf.right { right:34px; }
  .shelf .item { position:absolute; width:14px; height:20px; border-radius:3px; }

  /* 카운터 데스크 */
  .counter {
    position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    width: 300px; height: 78px;
    background: linear-gradient(180deg, var(--counter-top), var(--counter));
    border-radius:10px 10px 4px 4px;
    box-shadow: 0 10px 20px rgba(0,0,0,.25);
  }
  .counter::before {
    content:""; position:absolute; top:-8px; left:-10px; right:-10px; height:14px;
    background: var(--counter-top); border-radius:8px;
  }
  .counter .label {
    position:absolute; top:20px; left:0; right:0; text-align:center;
    color:#f4e6cf; font-size:11px; letter-spacing:2px; font-weight:700;
  }

  /* 캐릭터 */
  .actors { position:absolute; inset:0; }
  .actor {
    position:absolute; bottom: 44px;
    width: 128px; height: 200px;
    background-size: contain;
    background-position: bottom center;
    background-repeat:no-repeat;
    filter: drop-shadow(0 8px 8px rgba(0,0,0,.2));
    transition: transform .35s ease, opacity .4s ease, filter .3s ease;
    opacity:.5;
  }
  /* 위치: 직원은 카운터 뒤 중앙, 손님은 앞 좌우 */
  .actor.parkhyunju { left:50%; transform: translateX(-50%) scale(.9); bottom:78px; z-index:1;}
  .actor.ojunseo    { left: 20%; transform: translateX(-50%); z-index:3; }
  .actor.eeunae     { left: 80%; transform: translateX(-50%); z-index:3; }

  /* 말하는 중인 캐릭터 강조 + 통통 튀기 */
  .actor.active { opacity:1; filter: drop-shadow(0 12px 10px rgba(0,0,0,.28)); }
  .actor.ojunseo.active { animation: bounce .6s ease infinite alternate; }
  .actor.eeunae.active  { animation: bounce .6s ease infinite alternate; }
  .actor.parkhyunju.active { animation: bounceC .6s ease infinite alternate; }
  @keyframes bounce { from{ transform:translateX(-50%) translateY(0);} to{ transform:translateX(-50%) translateY(-10px);} }
  @keyframes bounceC { from{ transform:translateX(-50%) scale(.92) translateY(0);} to{ transform:translateX(-50%) scale(.92) translateY(-8px);} }

  /* 액션 아이콘 (캐릭터 위에 뿅) */
  .action-bubble {
    position:absolute; top:-6px; left:50%; transform:translateX(-50%) scale(0);
    width:44px; height:44px; border-radius:50%;
    background:#fff; border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center; font-size:22px;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
    transition: transform .3s cubic-bezier(.2,1.4,.5,1);
  }
  .action-bubble.show { transform:translateX(-50%) scale(1); }

  /* 대사 박스 */
  .dialogue-box {
    background: #fff;
    border-top: 3px solid var(--gold);
    padding: 20px 24px 22px;
    min-height: 128px;
    position:relative;
  }
  .speaker-tag {
    display:inline-flex; align-items:center; gap:8px;
    background: var(--ink); color:#fff;
    padding:5px 14px; border-radius:20px;
    font-weight:700; font-size:14px;
    margin-bottom:12px;
  }
  .speaker-tag .role {
    font-size:11px; opacity:.7; font-weight:500;
    border-left:1px solid rgba(255,255,255,.3); padding-left:8px;
  }
  .speaker-tag.ojunseo   { background:#2e7d6b; }
  .speaker-tag.parkhyunju{ background:#274b7a; }
  .speaker-tag.eeunae    { background:#8a6a4d; }
  .dialogue-text {
    font-size: 17px; line-height:1.6; color:#333;
    min-height: 52px;
  }
  .dialogue-text .cursor {
    display:inline-block; width:2px; height:18px; background:#333;
    vertical-align:middle; margin-left:2px; animation:blink .7s step-end infinite;
  }
  @keyframes blink { 50%{opacity:0;} }

  /* 컨트롤 바 */
  .controls {
    background:#f6f3ee; padding: 12px 24px;
    display:flex; align-items:center; justify-content:space-between;
    border-top:1px solid #e5ded2;
  }
  .progress { display:flex; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#d3c9b8; transition:all .3s;}
  .dot.done { background:var(--gold); }
  .dot.current { background:var(--ink); transform:scale(1.3); }
  .btns { display:flex; gap:8px; }
  button {
    font-family:inherit; font-size:13px; font-weight:600;
    padding:8px 16px; border-radius:8px; border:none; cursor:pointer;
    background:var(--ink); color:#fff; transition:opacity .2s;
  }
  button:hover { opacity:.85; }
  button.ghost { background:transparent; color:#8a6a4d; border:1px solid #d3c4a8; }
  .caption {
    text-align:center; font-size:12px; color:#9a8c76; padding:8px;
    background:#f6f3ee;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="titlebar">
      <div class="brand">롯데면세점 <span>· 인터넷면세점 상품 수령 데스크</span></div>
      <div class="tag">상용 API · Llama 70B</div>
    </div>

    <div class="scene">
      <div class="floor-lines"></div>
      <div class="signboard">DUTY FREE<small>PICK-UP COUNTER</small></div>
      <div class="shelf left">
        <div class="item" style="top:12px; left:12px; background:#c47b7b;"></div>

        <div class="item" style="top:50px; left:12px; background:#c4a87b;"></div>

      <div class="shelf right">

        <div class="item" style="top:50px; left:32px; background:#c4a87b;"></div>
        <div class="item" style="top:88px; left:12px; background:#7ba3c4;"></div>

      <div class="counter"><div class="label">PICK-UP</div></div>

      <div class="actors">

        </div>
        <div class="actor ojunseo" id="a-ojunseo">
          <div class="action-bubble" id="ab-ojunseo"></div>

        <div class="actor eeunae" id="a-eeunae">
          <div class="action-bubble" id="ab-eeunae"></div>

      </div>
    </div>

    <div class="dialogue-box">
      <div class="speaker-tag" id="speakerTag"><span id="speakerName">시작하기</span></div>
      <div class="dialogue-text" id="dialogueText">아래 재생 버튼을 누르면 대화가 시작됩니다.</div>
    </div>

    <div class="controls">
      <div class="progress" id="progress"></div>
      <div class="btns">
        <button class="ghost" id="restartBtn">처음부터</button>
        <button id="playBtn">▶ 재생</button>
      </div>
    </div>
    <div class="caption">Nemotron-Personas-Korea 데이터셋 · 페르소나 에이전트 멀티 대화 시뮬레이션</div>

  const playBtn = document.getElementById("playBtn");
  const restartBtn = document.getElementById("restartBtn");

  let idx = -1, playing = false, timer=null, typeTimer=null;

  function clearActive(){
    ["ojunseo","parkhyunju","eeunae"].forEach(k=>{
      document.getElementById("a-"+k).classList.remove("active");
      document.getElementById("ab-"+k).classList.remove("show");
    });
  }

  function typeText(text, done){
    dialogueText.innerHTML = "";
    let i=0;
    const cursor = '<span class="cursor"></span>';
    clearInterval(typeTimer);
    typeTimer = setInterval(()=>{
      i++;
      dialogueText.innerHTML = text.slice(0,i) + cursor;
      if(i>=text.length){
        clearInterval(typeTimer);
        dialogueText.innerHTML = text;
        if(done) done();
      }
    }, 45);
  }

  function showLine(i){
    const line = DIALOGUE[i];
    clearActive();

    // 화자 태그
    speakerTag.className = "speaker-tag " + line.speaker;
    speakerName.innerHTML = line.name + ' <span class="role">' + line.role + '</span>';

    // 화자 강조 + 액션
    const actor = document.getElementById("a-"+line.speaker);
    actor.classList.add("active");
    const bubble = document.getElementById("ab-"+line.speaker);
    if(line.action && ACTION_ICON[line.action]){
      bubble.textContent = ACTION_ICON[line.action];
      setTimeout(()=>bubble.classList.add("show"), 300);
    }

    // 진행 도트
    dots.forEach((d,k)=>{ d.className = "dot" + (k<i?" done":"") + (k===i?" current":""); });

    // 타이핑
    typeText(line.text, ()=>{
      if(playing){
        timer = setTimeout(()=>{
          if(idx < DIALOGUE.length-1){ idx++; showLine(idx); }
          else { endPlay(); }
        }, 1600);
      }
    });
  }

  function endPlay(){
    playing=false; playBtn.textContent="▶ 다시 재생";
    clearActive();
    dots.forEach(d=>d.className="dot done");
  }

  function play(){
    if(playing) { // 일시정지
      playing=false; playBtn.textContent="▶ 이어서";
      clearTimeout(timer); clearInterval(typeTimer);
      return;
    }
    playing=true; playBtn.textContent="⏸ 일시정지";
    if(idx>=DIALOGUE.length-1 || idx<0){ idx=0; }
    showLine(idx);
  }

  function restart(){
    playing=false; clearTimeout(timer); clearInterval(typeTimer);
    idx=-1; clearActive();
    dots.forEach(d=>d.className="dot");
    speakerTag.className="speaker-tag";
    speakerName.textContent="시작하기";
    dialogueText.textContent="아래 재생 버튼을 누르면 대화가 시작됩니다.";
    playBtn.textContent="▶ 재생";
  }

  playBtn.onclick = play;
  restartBtn.onclick = restart;
</script>
</body>
</html>
